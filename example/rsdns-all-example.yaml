# rsdns example config — full feature set (plugin pipeline)
# Usage: rsdns --config example/rsdns-all-example.yaml
# (repo root is the rsdns crate root)
#
# Top-level sections: binds[] / groups[] / upstreams[] + plugin sections
# (hosts / cache / rules / log / ui).  Each plugin owns its own config
# section and initializes from it.

# Listen addresses: plain IP:port = UDP, tcp:// prefix = TCP.
# Encrypted listeners (TLS cert/key below, auto self-signed when omitted):
#   tls://   → DoT (DNS-over-TLS, RFC 7858)
#   https:// → DoH (DNS-over-HTTPS, RFC 8484; HTTP/1.1 + HTTP/2, path /dns-query)
#   h3://    → DoH3 (DNS-over-HTTP/3; UDP socket, path /dns-query)
binds:
  - address: "0.0.0.0:14453"          # UDP
  - address: "tcp://0.0.0.0:14453"    # TCP
  # - address: "tls://0.0.0.0:8853"    # DoT
  # - address: "https://0.0.0.0:8443"  # DoH (HTTP/1.1 + HTTP/2)
  # - address: "h3://0.0.0.0:8443"     # DoH3 (HTTP/3)

# Server TLS certificate/key for the tls:// / https:// / h3:// binds.
# PEM files: cert may contain the leaf + intermediate chain; key is
# PKCS#8 / RSA / EC.  Both must be set together.  When both are omitted and
# at least one encrypted bind exists, an in-memory ECDSA P-256 self-signed
# certificate (SAN: localhost + loopback/private IPs) is generated at
# startup — enough for testing, not for production.
# tls_cert: /etc/rsdns/server.crt
# tls_key: /etc/rsdns/server.key

# Domain groups: name + optional domains list (inline or file:// sources).
# file:// sources are watched and reloaded automatically on change.
groups:
  - name: ad
    domains:
      - doubleclick.net
      - googlesyndication.com
      - googleadservices.com
    # file: /etc/rsdns/ad-block.txt   (reloaded automatically on change)
  - name: intranet
    domains:
      - corp.internal
      - lan
  - name: foo
    domains:
      - foo.com
      - foo.org
  - name: cdn
    domains:
      - cloudflare.com
    skip_cache: true
    # skip_speed: true   # also skip the speed plugin's latency sorting

# Upstream pools: named groups of servers.  mode: serial (default) |
# parallel | random | round_robin.
# cooldown (optional, per group): "<window>:<errors>:<cooldown>", e.g.
# "1m:10:10s" = if a server fails 10 times within a 1-minute window, cool it
# down for 10 seconds (skipped during queries).
# IP-address servers are used directly and also serve as the bootstrap
# resolvers for domain-address servers (which are resolved at startup and
# use all resolved A+AAAA addresses).
# server_name overrides the TLS SNI / certificate name for DoT/DoH/DoH3/DoQ
# (defaults to the address host when absent).
upstreams:
  - name: bootstrap
    mode: serial
    servers:
      - address: 223.5.5.5
  - name: default
    mode: round_robin
    cooldown: "1m:10:10s"
    servers:
      - address: tls://dot.pub           # TLS — domain resolved via IP servers, all A+AAAA IPs used
        server_name: dns.alidns.com
        pool:
          # DoT benefits most from multiple long-lived connections.
          max_size: 8
          prefer_family: ipv4
          connect_timeout: 3
      - address: https://dns.quad9.net/dns-query  # DoH — domain resolved via IP servers
        pool:
          # DoH already multiplexes over HTTP/2; keep the pool small.
          max_size: 4
      - address: tls://1.1.1.1           # TLS with static IP
  - name: overseas
    mode: parallel
    servers:
      - address: tls://8.8.8.8
      - address: https://cloudflare-dns.com/dns-query
      - address: h3://mozilla.cloudflare-dns.com/dns-query  # DNS-over-HTTP/3
      - address: quic://dns.adguard.com  # DNS-over-QUIC

# Cache configuration
cache:
  size: 4096                       # LRU capacity
  min_ttl: 60                      # clamp TTL lower bound (seconds)
  max_ttl: 3600                    # clamp TTL upper bound (seconds)
  keep_ttl: false                  # global default: clamp TTL

# Hosts: suffix-matched static IP mapping (supports file: prefix and wildcard).
# Two line formats:
#   IP domain [domain...]                       → static IP mapping
#   original_domain alias1 alias2 ...           → aliases: querying an alias
#     answers under the queried name with the original domain's IP; when the
#     original domain has no IP mapping, the query continues through the
#     pipeline rewritten to the original domain (answered under the queried name).
hosts:
  - "127.0.0.1 localhost"
  - "::1       localhost"
  - "192.168.1.1 router.lan"
  - "0.0.0.0 ad-domain.com"        # exact + all subdomains → 0.0.0.0
  - "edge.example.com cdn1.example.com cdn2.example.com"   # alias line
  - "file:/etc/hosts"

# Rules: matched in order, first hit stops.
# match syntax (no backward compat):
#   (empty)         → match all
#   group:{name}    → group reference
#   {a.com,b.com}   → inline domain set (no braces, comma separated)
#   "{1}.a.com,{1}.b.com" → comma-separated placeholder templates (any one
#                           matching applies the rule; captures shared)
rules:
  # Block ad group with poison (A=0.0.0.0, AAAA=::)
  - match: "group:ad"
    action:
      type: block
      response: poison

  # Block with NXDOMAIN
  - match: "banned.example"
    qtype: A
    action:
      type: block
      response: nxdomain

  # CNAME rewrite: resolve target via upstream and return its IP
  - match: "group:foo"
    qtype: ANY
    action:
      type: cname
      target: site.182682.xyz
      ttl: 600
      upstream: default

  # Forward intranet to default upstream, skip cache (group skip_cache)
  - match: "group:intranet"
    action:
      type: forward
      upstream: default

  # Forward to overseas upstream with custom TTL
  - match: "google.com"
    qtype: A
    action:
      type: forward
      upstream: overseas
      ttl: 60       # rewrite response TTL to 60s
      max_answers: 5   # cap returned answers (default 5; 0 = no limit)
      edns: "203.0.113.0/24"   # 固定 EDNS Client Subnet (RFC 7871)，该规则的查询都通告此网段

  # Forward with Cloudflare ECH completion (HTTPS queries): when an HTTPS
  # answer's ipv4hint falls inside the built-in Cloudflare IPv4 ranges but
  # carries no `ech` SvcParam, that record is replaced by an HTTPS template
  # fetched from cloudflare_ech (same upstream, cached by TTL).
  #   cloudflare_ech: 字面域名，通常用 crypto.cloudflare.com
  - match: "cloudflare-cdn.example.com"
    qtype: HTTPS
    action:
      type: forward
      upstream: default
      cloudflare_ech: "crypto.cloudflare.com"

  # Forward a CDN group's subdomains (inline suffix match:
  # cdn.cloudflare.com and below)
  - match: "cdn.cloudflare.com"
    action:
      type: forward
      upstream: default

  # Rewrite: synthesize an A record for the query name, no upstream query.
  # target is a literal dotted-quad IPv4 or a placeholder template filled
  # from the match captures (each capture = one octet).
  #   match "{1}.32.0.2.example.com" + target "{1}.32.0.2" → A <cap1>.32.0.2
  #   match "{1}.example.com"        + target "10.10.0.0" → A 10.10.0.0
  - match: "{1}.32.0.2.example.com"
    qtype: A
    action:
      type: rewrite
      target: "{1}.32.0.2"
      ttl: 300

  # Default catch-all
  - match: ""
    action:
      type: forward
      upstream: default
      deny_qtypes: ["HTTPS"]

# Query log (optional): per-query access log with template placeholders.
# Placeholders: {type} {name} {proto} {remote} {action} {port} {size} {duration} {rcode} {answers}
#              {time} — query start time (wall-clock, local tz, DD/MM/YYYY:HH:MM:SS ±HHMM)
# Output: stdout by default; set directory to write rotating files instead.
#   directory: "{dir}:{maxsize}:{numfile}" — write to dir/query.log; when the
#   active file reaches maxsize it is gzip-archived as query.log.N.gz with N
#   increasing monotonically (existing archives are never renamed) and a
#   fresh file starts; at most numfile files (active + archives) are kept,
#   the oldest (lowest-N) archives are pruned.
#   maxsize supports k/K/m/M/g/G suffixes (5m = 5 MB).  A bare directory path
#   (e.g. "/var/log/rsdns") uses the default maxsize/numfile (5m / 5 files).
log:
  format: '{remote}:{port} {name} [{type}] {rcode} {action} {duration}'
  # directory: '/var/log/rsdns'           # bare path → 5m / 5 files
  # directory: '/var/log/rsdns:2m:3'      # explicit rotation settings

# Speed plugin (optional): latency-orders A/AAAA answers by TCP connect RTT.
# Disabled by default — set enable: true to turn it on.
#   type:          probe type, "syn" (default)
#   port:          probe destination port, 443 (default)
#   family:        record family to sort: ANY (default) / A / AAAA; a query
#                  type only participates when it matches (A matches A/ANY,
#                  AAAA matches AAAA/ANY)
#   timeout:       per-IP probe timeout (bare number = seconds, or "500ms")
speed:
  enable: false
  type: syn
  port: 443
  family: ANY
  timeout: 1s

# Built-in web UI (optional).  Serves two paths on one listener:
#   /         mobile-friendly HTML dashboard (memory / cache / query metrics,
#             colored rounded cards; auto-refreshes every 3s)
#   /metrics  Prometheus text format (for scrapers)
# Registered metrics:
#   rsdns_logs_*, rsdns_hosts_*, rsdns_groups_*, rsdns_cache_*,
#   rsdns_rules_*, rsdns_upstream_*, rsdns_upstream_pool_*,
#   rsdns_jemalloc_* (under the jemalloc feature)
ui:
  bind: "127.0.0.1:8153"
