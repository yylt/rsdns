# rsdns example config — full feature set (plugin pipeline)
# Usage: rsdns --config example/rsdns-all-example.yaml
# (repo root is the rsdns crate root)
#
# Top-level sections: binds[] / groups[] / upstreams[] + plugin sections
# (hosts / cache / rules / cloudflare / balance / log / ui).  Each plugin owns its own config
# section and initializes from it.

# Listen addresses: plain IP:port = UDP, tcp:// prefix = TCP.
# Encrypted listeners (TLS cert/key below, auto self-signed when omitted):
#   tls://   → DoT (DNS-over-TLS, RFC 7858)
#   https:// → DoH (DNS-over-HTTPS, RFC 8484; HTTP/1.1 + HTTP/2, path /dns-query)
#   h3://    → DoH3 (DNS-over-HTTP/3; UDP socket, path /dns-query)
binds:
  - address: "0.0.0.0:14453"          # UDP
  - address: "tcp://0.0.0.0:14453"    # TCP
  # - address: "tls://0.0.0.0:8853"    # DoT
  # - address: "https://0.0.0.0:8443"  # DoH (HTTP/1.1 + HTTP/2)
  # - address: "h3://0.0.0.0:8443"     # DoH3 (HTTP/3)

# Server TLS certificate/key for the tls:// / https:// / h3:// binds.
# PEM files: cert may contain the leaf + intermediate chain; key is
# PKCS#8 / RSA / EC.  Both must be set together.  When both are omitted and
# at least one encrypted bind exists, an in-memory ECDSA P-256 self-signed
# certificate (SAN: localhost + loopback/private IPs) is generated at
# startup — enough for testing, not for production.
# tls_cert: /etc/rsdns/server.crt
# tls_key: /etc/rsdns/server.key

# Domain groups: name + optional domains list (inline or file:// sources).
# file:// sources are watched and reloaded automatically on change.
groups:
  - name: ad
    domains:
      - doubleclick.net
      - googlesyndication.com
      - googleadservices.com
    # file: /etc/rsdns/ad-block.txt   (reloaded automatically on change)
  - name: intranet
    domains:
      - corp.internal
      - lan
  - name: foo
    domains:
      - foo.com
      - foo.org
  - name: cdn
    domains:
      - cloudflare.com
    skip_cache: true
    # skip_balance: true   # also skip the balance stage's whole post-pass
    #                      # (prefers / mode / max_answers), not Cloudflare

# Upstream pools: named groups of servers.  mode: serial (default) |
# parallel | random | round_robin.
# query_timeout (optional, per group): total seconds including queueing,
# connections and all fallback attempts; default 5, must be positive.
# Per-server connect_timeout and the internal 5s DNS timeout remain stage limits.
# attempt_timeout (optional, per group): per-server seconds including queueing,
# connection-lock waiting, connection establishment and DNS request; default 2.
# Each IP backs off 2/4/8/16/32 seconds after connection failures or eviction.
# DNS success resets backoff; all backed-off addresses fail fast to the next server.
# IP-address servers are used directly and also serve as the bootstrap
# resolvers for domain-address servers (which are resolved at startup and
# use all resolved A+AAAA addresses).
# server_name overrides the TLS SNI / certificate name for DoT/DoH/DoH3/DoQ
# (defaults to the address host when absent).
upstreams:
  - name: bootstrap
    mode: serial
    servers:
      - address: 223.5.5.5
  - name: default
    mode: round_robin
    query_timeout: 5
    attempt_timeout: 2
    servers:
      - address: tls://dot.pub           # TLS — domain resolved via IP servers, all A+AAAA IPs used
        server_name: dns.alidns.com
        pool:
          # One shared multiplexed connection, at most 32 in-flight requests.
          idle_timeout: 30
          prefer_family: ipv4
          connect_timeout: 3
      - address: https://dns.quad9.net/dns-query  # DoH — domain resolved via IP servers
        pool:
          # HTTP/2 shares one connection across concurrent requests.
          idle_timeout: 30
      - address: tls://1.1.1.1           # TLS with static IP
  - name: overseas
    mode: parallel
    servers:
      - address: tls://8.8.8.8
      - address: https://cloudflare-dns.com/dns-query
      - address: h3://mozilla.cloudflare-dns.com/dns-query  # DNS-over-HTTP/3
      - address: quic://dns.adguard.com  # DNS-over-QUIC

# Cache configuration
cache:
  size: 4096                       # LRU capacity
  min_ttl: 60                      # clamp TTL lower bound (seconds)
  max_ttl: 3600                    # clamp TTL upper bound (seconds)
  keep_ttl: false                  # global default: clamp TTL


# Hosts: suffix-matched static IP mapping (supports file: prefix and wildcard).
# Two line formats:
#   IP domain [domain...]                       → static IP mapping
#   original_domain alias1 alias2 ...           → aliases: querying an alias
#     answers under the queried name with the original domain's IP; when the
#     original domain has no IP mapping, the query continues through the
#     pipeline rewritten to the original domain (answered under the queried name).
hosts:
  - "127.0.0.1 localhost"
  - "::1       localhost"
  - "192.168.1.1 router.lan"
  - "0.0.0.0 ad-domain.com"        # exact + all subdomains → 0.0.0.0
  - "edge.example.com cdn1.example.com cdn2.example.com"   # alias line
  - "file:/etc/hosts"

# Rules: matched in order, first hit stops.
# qtype: uppercase names only; comma-separated OR match (e.g. "A, AAAA").
# Omitted or ANY matches all; numeric/lowercase values are invalid.
# match syntax (no backward compat):
#   (empty)         → match all
#   group:{name}    → group reference
#   {a.com,b.com}   → inline domain set (no braces, comma separated)
#   "{1}.a.com,{1}.b.com" → comma-separated placeholder templates (any one
#                           matching applies the rule; captures shared)
rules:
  # Block ad group with poison (A=0.0.0.0, AAAA=::)
  - match: "group:ad"
    action:
      type: block
      response: poison

  # Block with NXDOMAIN
  - match: "banned.example"
    qtype: A
    action:
      type: block
      response: nxdomain

  # CNAME rewrite: resolve target via upstream and return its IP
  - match: "group:foo"
    qtype: ANY
    action:
      type: cname
      target: site.182682.xyz
      ttl: 600
      upstream: default

  # Forward intranet to default upstream, skip cache (group skip_cache)
  - match: "group:intranet"
    action:
      type: forward
      upstream: default

  # Forward to overseas upstream with custom TTL
  - match: "google.com"
    qtype: A
    action:
      type: forward
      upstream: overseas
      ttl: 60       # rewrite response TTL to 60s
      edns: "203.0.113.0/24"   # 固定 EDNS Client Subnet (RFC 7871)，该规则的查询都通告此网段

  # Cloudflare template substitution is an independent top-level post-pass.
  - match: "cloudflare-cdn.example.com"
    qtype: "A, AAAA, HTTPS"
    action:
      type: forward
      upstream: default

  # Forward a CDN group's subdomains (inline suffix match:
  # cdn.cloudflare.com and below)
  - match: "cdn.cloudflare.com"
    action:
      type: forward
      upstream: default

  # Rewrite: synthesize an A record for the query name, no upstream query.
  # target is a literal dotted-quad IPv4 or a placeholder template filled
  # from the match captures (each capture = one octet).
  #   match "{1}.32.0.2.example.com" + target "{1}.32.0.2" → A <cap1>.32.0.2
  #   match "{1}.example.com"        + target "10.10.0.0" → A 10.10.0.0
  - match: "{1}.32.0.2.example.com"
    qtype: A
    action:
      type: rewrite
      target: "{1}.32.0.2"
      ttl: 300

  # Default catch-all
  - match: ""
    action:
      type: forward
      upstream: default
      deny_qtypes: ["HTTPS"]

# Query log (optional): per-query access log with template placeholders.
# Placeholders: {type} {name} {proto} {remote} {action} {port} {size} {duration} {rcode} {answers}
#              {time} — query start time (wall-clock, local tz, DD/MM/YYYY:HH:MM:SS ±HHMM)
# Output: stdout by default; set directory to write to dir/query.log instead.
#   directory: a plain directory path (created if missing).  rsdns never
#   rotates or compresses this file itself — use an external logrotate
#   (see example/rsdns.logrotate).  After renaming the file, logrotate must
#   trigger `systemctl reload rsdns` (SIGHUP), which makes rsdns reopen
#   dir/query.log.  SIGHUP only reopens the log; it does not reload config.
log:
  format: '{remote}:{port} {name} [{type}] {rcode} {action} {duration}'
  # directory: '/var/log/rsdns'

# Balance plugin (optional): reorders A/AAAA answers before they are
# returned, and optionally caps the total answer count.  Absent → no
# reordering, no truncation (upstream answers are returned as-is).
#   mode:        post-pass applied when a family's records are all equally
#                ranked (no CIDR hit, or all in one CIDR):
#                  none        (default) nothing beyond prefers/max_answers
#                  round_robin rotate from a fresh random offset per query —
#                              stateless, no shared counter
#                  speed       latency-order by TCP-connect RTT
#                Once `prefers` produces differing ranks the stable
#                prefer-sort wins and mode does not run.
#   prefers:     flat CIDR list, order = priority: an answer IP in an earlier
#                CIDR is sorted ahead of one in a later CIDR; unmatched IPs
#                keep their order at the end.  All clients see the same order.
#   max_answers: optional whole-answer cap after reordering (0 or absent =
#                no limit).  Formerly `forward.max_answers`, now global.
#   speed:       parameters for mode: speed — type "syn" (default), port 443,
#                timeout 1s (bare seconds or "500ms").
# Only groups with `skip_balance: true` skip this pass; cache hits run it.
balance:
  mode: round_robin
  max_answers: 5
  prefers:
    - "223.5.5.0/24"       # e.g. a domestic/backbone CIDR to prefer
    - "114.114.0.0/16"
    # - "2400:3200::/32"    # IPv6 CIDRs only match AAAA records
  # speed:                  # only read when mode: speed
  #   type: syn
  #   port: 443
  #   timeout: 1s
# Independent Cloudflare post-pass, before balance; also runs on cache/hosts
# responses and for skip_balance/skip_cache groups, even without balance.
# Optional templates inside built-in CF IPv4/IPv6 ranges, domain@upstream:
# ech: HTTPS ECH template; a/aaaa: replacement addresses (independent fields).
# Skipped for DO=1/CD=1. Template failure keeps the original answer.
# Address substitution assumes the template addresses also serve the query name.
# cloudflare:
#   ech: "crypto.cloudflare.com@default"
#   a: "crypto.cloudflare.com@default"
#   aaaa: "crypto.cloudflare.com@default"

# Built-in web UI (optional).  Serves two paths on one listener:
#   /         mobile-friendly HTML dashboard (memory / cache / query metrics,
#             colored rounded cards; auto-refreshes every 3s)
#   /metrics  Prometheus text format (for scrapers)
# Registered metrics:
#   rsdns_queries_total{proto}, rsdns_query_parse_errors_total,
#   rsdns_query_rcode_total{rcode}, rsdns_query_qtype_total{qtype},
#   rsdns_query_duration_seconds{proto} (histogram),
#   rsdns_logs_*, rsdns_hosts_*, rsdns_groups_*, rsdns_cache_*,
#   rsdns_rules_*, rsdns_upstream_* (incl. rsdns_upstream_rcode_total,
#     rsdns_upstream_latency_seconds histogram), rsdns_upstream_pool_*,
#   rsdns_jemalloc_* (under the jemalloc feature)
ui:
  bind: "127.0.0.1:8153"
