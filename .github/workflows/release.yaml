name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BIN_NAME: "rsdns"

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ubuntu-latest
    # Build inside Debian 12 so the binaries link against glibc 2.36.
    # ubuntu-latest (24.04) ships glibc 2.39, which would make gnu binaries
    # require a newer libc than Debian 12 provides.
    container:
      image: debian:12
    env:
      DEBIAN_FRONTEND: noninteractive
      # glibc uses 4k pages on both x86_64 and aarch64 (Debian 12 default)
      JEMALLOC_SYS_WITH_LG_PAGE: "12"
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            target: x86_64-unknown-linux-gnu
            artifact-dir: release
            build-args: "--release"

          - name: Linux aarch64
            target: aarch64-unknown-linux-gnu
            artifact-dir: release
            build-args: "--release -vv"

    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates git \
            build-essential pkg-config cmake \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          # cross-compile aarch64 against Debian 12's arm64 glibc (2.36)
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: |
          cargo build ${{ matrix.platform.build-args }} --bin ${{ env.BIN_NAME }} --target ${{ matrix.platform.target }}

      - name: Package release artifacts
        run: |
          mkdir -p dist
          cp target/${{ matrix.platform.target }}/${{ matrix.platform.artifact-dir }}/${{ env.BIN_NAME }} dist/${{ env.BIN_NAME }}-${{ matrix.platform.target }}
          tar -C dist -czf dist/${{ env.BIN_NAME }}-${{ matrix.platform.target }}.tar.gz ${{ env.BIN_NAME }}-${{ matrix.platform.target }}

      - name: Store rsdns artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.platform.target }}
          path: dist/${{ env.BIN_NAME }}-${{ matrix.platform.target }}.tar.gz
          retention-days: 1

  release:
    name: Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          files: |
            artifacts/**/${{ env.BIN_NAME }}-*.tar.gz
